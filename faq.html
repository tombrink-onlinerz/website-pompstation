    { "@type": "Question", "name": "Is Pompstation geschikt voor à la carte dineren?", "acceptedAnswer": { "@type": "Answer", "text": "Bij Pompstation Amsterdam eet je elke woensdag-, donderdag-, vrijdag- en zaterdagavond van ons à la carte menu. Wij serveren premium steaks van de houtskoolgrill, verse seizoensvis en internationale gerechten, vers bereid door chef Allessandro en zijn team. Van ons prijswinnende carpaccio, ceviche, gegrilde gamba's en klassieke steak tartare tot seafood pasta, vongole en ravioli met botersaus en sage." } },
    { "@type": "Question", "name": "Wat voor keuken serveert Pompstation Amsterdam?", "acceptedAnswer": { "@type": "Answer", "text": "Pompstation Amsterdam is een steakhouse en grill met internationale invloeden: premium steaks, gegrilde vis, oesters en smoked groenten, veel bereid op houtskoolvuur, aangevuld met vegetarische en veganistische gerechten." } },
    { "@type": "Question", "name": "Zijn er vegetarische opties op het menu?", "acceptedAnswer": { "@type": "Answer", "text": "Ja. Hoewel Pompstation Amsterdam bekend staat als premium steakhouse en grill, is de kaart ruim uitgebreid met gegrilde groenten en visgerechten. Ook voor vegetarische en veganistische gerechten kun je goed bij ons terecht." } },
    { "@type": "Question", "name": "Kan ik bij Pompstation ook alleen komen voor cocktails en live muziek?", "acceptedAnswer": { "@type": "Answer", "text": "Ja. Je kunt bij Pompstation Amsterdam ook zonder diner aanschuiven aan de bar voor cocktails, een glas wijn en de live muziek op donderdag-, vrijdag- en zaterdagavond. Reserveren is niet verplicht voor de bar, maar op drukke avonden wel aan te raden." } },
    { "@type": "Question", "name": "Is er live muziek bij Pompstation?", "acceptedAnswer": { "@type": "Answer", "text": "Ja. Elke donderdag-, vrijdag- en zaterdagavond speelt er live muziek bij Pompstation Amsterdam, vaak instrumentaal en door artiesten van onder andere het Conservatorium van Amsterdam. Vaste stijlen zijn jazz, soul, singer-songwriter en bossanova. De muziek blijft altijd op de achtergrond, zodat je gewoon kunt praten. Wil je het nog zachter, vraag dan om een tafel achterin het restaurant." } },
    { "@type": "Question", "name": "Heeft Pompstation een terras?", "acceptedAnswer": { "@type": "Answer", "text": "Ja. Pompstation Amsterdam heeft een groot en zonnig terras in de binnentuin. Je kunt een tafel op het terras vooraf reserveren, wat uniek is in Amsterdam. Ook een terrastafel voor een groep is vooraf te boeken via mail of telefoon." } },

    { "@type": "Question", "name": "Kan ik Pompstation afhuren?", "acceptedAnswer": { "@type": "Answer", "text": "Jazeker. Download onze brochure of vul het aanvraagformulier in voor een offerte op maat. Onze eventmanager neemt daarna contact op om de mogelijkheden door te nemen." } },

    { "@type": "Question", "name": "Hoe kom ik bij Pompstation Amsterdam?", "acceptedAnswer": { "@type": "Answer", "text": "Pompstation Amsterdam ligt aan de Zeeburgerdijk 52 in Amsterdam-Oost. Tram 14, 19 en 25 stoppen bij halte Zeeburgerdijk, vlak voor de deur. Vanaf Amsterdam Centraal ben je met de taxi binnen tien minuten bij ons. Vanaf Muiderpoortstation zijn we goed te lopen, en vanaf de ring A10 sta je binnen enkele minuten met de auto voor het pand." } },
    { "@type": "Question", "name": "Waar kan ik parkeren bij Pompstation?", "acceptedAnswer": { "@type": "Answer", "text": "Parkeren in de buurt is goed mogelijk. Er zijn verschillende parkeergarages in de omgeving, en in de omliggende straten is doorgaans ook plek: de Zeeburgerdijk zelf, de Borneostraat en de Timorstraat zijn vaak goede opties. Actuele tarieven vind je via de EasyPark-app." } },
    { "@type": "Question", "name": "Kan ik online reserveren bij Pompstation?", "acceptedAnswer": { "@type": "Answer", "text": "Ja. Je reserveert online via het reserveringssysteem op pompstation.nu, 24 uur per dag. Voor groepen vanaf tien personen, terrasgroepen en afhuur werken we met een aanvraagformulier of telefonisch contact via 020 227 9885." } },
    { "@type": "Question", "name": "Is Pompstation rolstoeltoegankelijk?", "acceptedAnswer": { "@type": "Answer", "text": "Jazeker. Bij de entree is een speciale ramp beschikbaar en ons personeel helpt graag. Laat het bij je reservering weten, dan houden we er rekening mee bij de tafelindeling." } },
    { "@type": "Question", "name": "Mag ik mijn hond meenemen naar Pompstation?", "acceptedAnswer": { "@type": "Answer", "text": "Ja, dat vinden wij heel gezellig. We vragen alleen of je hond netjes en rustig is, zodat andere gasten er geen last van hebben." } },
